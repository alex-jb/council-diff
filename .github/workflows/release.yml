name: Release to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify NPM_TOKEN secret is present
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN GitHub Actions secret is empty or unset."
            echo "Root cause of 5 consecutive npm publish failures v0.3.0 -> v0.4.2."
            echo ""
            echo "How to fix (Alex, ~3 min):"
            echo "  1. npmjs.com -> Access Tokens -> Generate New Token -> Granular Access Token"
            echo "  2. Scope: council-diff package (read+write), expiration 1 year"
            echo "  3. This repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "     Name: NPM_TOKEN   Value: <token from step 2>"
            echo "  4. gh workflow run release.yml -f tag=v0.4.3"
            exit 1
          fi
          echo "NPM_TOKEN secret present (length: $(echo -n '${{ secrets.NPM_TOKEN }}' | wc -c))"

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
